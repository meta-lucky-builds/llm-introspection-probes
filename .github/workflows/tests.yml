name: tests

on:
  push:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # transformers 5.22 needs 3.11 or newer, and rented images often stop at the oldest version allowed.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.11.*" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==5.22.*" numpy pytest jinja2
      - name: Run tests
        env:
          # Tests must never reach the Hub. This turns an accidental download into an error.
          HF_HUB_OFFLINE: "1"
        run: python -m pytest -q
