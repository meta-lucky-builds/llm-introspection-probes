<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Logit lift for the injected position, by task, on Qwen3-1.7B</title>
  <desc id="desc">Point estimates with 95 percent bootstrap intervals. Injection task 6.28; pick at random 7.13; most interesting 4.15; does not belong 13.88; injection task with norm-matched random direction 5.82; with impact-search random direction 4.65. All intervals are above zero.</desc>
  <style>
    .surface { fill: #ffffff; }
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .grid { stroke: #e3e6ea; stroke-width: 1; }
    .base { stroke: #8c959f; stroke-width: 1; }
    .ci-c { stroke: #2a6fdb; stroke-width: 2; stroke-linecap: round; }
    .dot-c { fill: #2a6fdb; stroke: #ffffff; stroke-width: 2; }
    .ci-r { stroke: #7d8590; stroke-width: 2; stroke-linecap: round; }
    .dot-r { fill: #7d8590; stroke: #ffffff; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #0d1117; }
      .ink { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .grid { stroke: #262c33; }
      .base { stroke: #6e7681; }
      .ci-c { stroke: #6ea8fe; }
      .dot-c { fill: #6ea8fe; stroke: #0d1117; }
      .ci-r { stroke: #8b949e; }
      .dot-r { fill: #8b949e; stroke: #0d1117; }
    }
    text { font-size: 13px; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 12px; }
  </style>
  <rect class="surface" width="720" height="352" rx="6"/>
  <text class="ink h" x="16" y="26">The injected position gains even when nobody asks about injection</text>
  <text class="muted s" x="16" y="45">Logit lift for the injected position. Qwen3-1.7B, layer 3, 6× activation norm. Bars are 95% bootstrap intervals.</text>

  <line class="base" x1="250" y1="64" x2="250" y2="306"/>
  <line class="grid" x1="369.4" y1="64" x2="369.4" y2="306"/>
  <line class="grid" x1="488.9" y1="64" x2="488.9" y2="306"/>
  <line class="grid" x1="608.3" y1="64" x2="608.3" y2="306"/>

  <text class="muted s" x="16" y="76">Concept vector</text>
  <text class="ink" x="16" y="100">Asked about injection</text>
  <line class="ci-c" x1="351.8" y1="96" x2="457.4" y2="96"/><circle class="dot-c" cx="400" cy="96" r="6"/>
  <text class="ink" x="16" y="134">“Pick one at random”</text>
  <line class="ci-c" x1="375.2" y1="130" x2="456.2" y2="130"/><circle class="dot-c" cx="420.3" cy="130" r="6"/>
  <text class="ink" x="16" y="168">“Most interesting”</text>
  <line class="ci-c" x1="295.9" y1="164" x2="412.9" y2="164"/><circle class="dot-c" cx="349.1" cy="164" r="6"/>
  <text class="ink" x="16" y="202">“Does not belong”</text>
  <line class="ci-c" x1="521.1" y1="198" x2="633.9" y2="198"/><circle class="dot-c" cx="581.6" cy="198" r="6"/>

  <text class="muted s" x="16" y="232">Random direction, asked about injection</text>
  <text class="ink" x="16" y="256">Norm-matched</text>
  <line class="ci-r" x1="340.8" y1="252" x2="432.8" y2="252"/><circle class="dot-r" cx="389" cy="252" r="6"/>
  <text class="ink" x="16" y="290">Impact search</text>
  <line class="ci-r" x1="326.7" y1="286" x2="399.5" y2="286"/><circle class="dot-r" cx="361.1" cy="286" r="6"/>

  <text class="ink" x="466" y="100">6.28</text>
  <text class="ink" x="465" y="134">7.13</text>
  <text class="ink" x="421" y="168">4.15</text>
  <text class="ink" x="642" y="202">13.88</text>
  <text class="ink" x="441" y="256">5.82</text>
  <text class="ink" x="408" y="290">4.65</text>

  <text class="muted s" x="250" y="324" text-anchor="middle">0</text>
  <text class="muted s" x="369.4" y="324" text-anchor="middle">5</text>
  <text class="muted s" x="488.9" y="324" text-anchor="middle">10</text>
  <text class="muted s" x="608.3" y="324" text-anchor="middle">15</text>
  <text class="muted s" x="430" y="342" text-anchor="middle">Logit lift, injected run minus clean run</text>
</svg>
