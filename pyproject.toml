[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mechinterp"
version = "0.1.0"
description = "Preregistered experiments on LLM introspection and whether activation monitors are independent of self-report"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "transformers>=4.55", "numpy", "jinja2"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/meta-lucky-builds/mechinterp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
