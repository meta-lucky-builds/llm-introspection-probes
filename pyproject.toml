[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mechinterp"
version = "0.1.0"
description = "Preregistered mechanistic interpretability experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "transformers>=4.55", "numpy", "jinja2"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
